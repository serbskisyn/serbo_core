[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serbo_core"
version = "0.1.0"
description = "Geteilter Kern für die Serbo-Bots (Goldkind / Atolls / Privat): Config, Security, Telegram-Plumbing, LLM-Client, Sheets, Semantic."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["serbo_core*"]
